[package]
name = "ritmtrener"
version = "0.1.0"
description = "Ритм-тренер"
edition = "2021"

[lib]
name = "ritmtrener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
