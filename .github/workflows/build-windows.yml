name: Windows installer

on:
  workflow_dispatch:          # запуск кнопкою "Run workflow"
  push:
    tags: ["v*"]              # або при створенні мітки версії, наприклад v1.0.0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ORT_VERSION: "1.22.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BeatPractice/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: BeatPractice/src-tauri

      # ---------- 1. ONNX Runtime ----------
      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ort.zip"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "ORT_DIR=$env:RUNNER_TEMP\onnxruntime-win-x64-$env:ORT_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---------- 2. C++ core ----------
      - name: Build core (beatcore_c.dll)
        shell: pwsh
        working-directory: beat-core
        run: |
          cmake -S . -B build -DORT_DIR="$env:ORT_DIR"
          cmake --build build --config Release --target beatcore_c
          Get-ChildItem build -Recurse -Filter beatcore_c.dll

      # Необов'язкова перевірка: якщо впаде, збірка не зупиняється, але перегляньте журнал.
      - name: Core smoke test (optional)
        continue-on-error: true
        shell: pwsh
        working-directory: beat-core
        run: |
          cmake --build build --config Release --target meter_test
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" build\Release\
          .\build\Release\meter_test.exe tests\data\meter

      # ---------- 3. Neural network models (cached) ----------
      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: beat-core/models
          key: models-v2

      # 1) our own mirror (created once by the "Mirror models" workflow), if it exists
      - name: Download models from the project's own release
        if: steps.models-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p beat-core/models
          gh release download models-v1 --repo "${{ github.repository }}" --dir beat-core/models --skip-existing

      # 2) whatever is still missing comes from the original sources
      - name: Download missing models from the original sources
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: beat-core
        run: |
          sh scripts/fetch_models.sh
          sh scripts/fetch_stem_model.sh            # 6 parts: drums, bass, other, vocals, guitar, piano
          sh scripts/fetch_stem_model.sh --four     # 4-part model, used automatically if the 6-part one cannot be loaded
          ls -la models

      # Optional check: prints how many parts the stem model gives (expected 6)
      - name: Probe the stem model (optional)
        continue-on-error: true
        shell: pwsh
        working-directory: beat-core
        run: |
          cmake --build build --config Release --target stems_cli
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" build\Release\ -Force
          .\build\Release\stems_cli.exe --probe --model models\htdemucs_6s_fp16weights.onnx

      # ---------- 4. Put the core inside the installer ----------
      - name: Stage core into the app
        shell: pwsh
        run: |
          $dst = "BeatPractice\src-tauri\core-bundle"
          New-Item -ItemType Directory -Force "$dst\build", "$dst\models" | Out-Null
          Copy-Item "beat-core\build\Release\beatcore_c.dll" "$dst\build\"
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" "$dst\build\"
          # Visual C++ runtime next to the DLLs, so the program also starts on clean Windows
          foreach ($f in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $p = Join-Path $env:SystemRoot "System32\$f"
            if (Test-Path $p) { Copy-Item $p "$dst\build\" } else { Write-Warning "$f not found" }
          }
          Copy-Item "beat-core\models\*.onnx" "$dst\models\"
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length

      # ---------- 5. App + installer ----------
      - name: Install frontend dependencies
        shell: bash
        working-directory: BeatPractice
        run: npm ci || npm install

      # Full lists of the Rust and JavaScript packages (part of the third-party notices in the installer)
      - name: Collect dependency licenses (optional)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p BeatPractice/src-tauri/legal
          (cd BeatPractice && npx --yes license-checker-rseidelsohn --production --excludePrivatePackages --csv > src-tauri/legal/licenses-npm.txt)
          cargo install cargo-license --locked
          (cd BeatPractice/src-tauri && cargo license --avoid-dev-deps --tsv > legal/licenses-rust.txt)

      - name: Build installer
        shell: bash
        working-directory: BeatPractice
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BeatPractice-Windows-installer
          path: BeatPractice/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0
          if-no-files-found: error
